name: Deploy

# Publishes site/ to GitHub Pages. A merge to main doesn't ship: this runs only
# for a published release, an explicit ship run, or a call from another
# workflow (the release workflow calls it, because a release it creates can't
# trigger this workflow's release event).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to ship, such as v1.15.0 (empty ships main)
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Release tag to ship
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued deploy waits instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The environment checks the run's own ref, not the ref checked out
      # below, so the requested ref is checked here: only main, or an
      # existing v* release tag whose commit is on main, can ship.
      - name: Check the ref to ship
        id: ref
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          case "$REF" in
            main | refs/heads/main) ref=refs/heads/main ;;
            refs/tags/v*) ref=$REF ;;
            v*) ref=refs/tags/$REF ;;
            *)
              echo "::error::Deploy ships main or a v* release tag, not '$REF'."
              exit 1
              ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
      - name: Check the commit is on main
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          git rev-parse --verify --quiet "$REF^{commit}" > /dev/null || {
            echo "::error::'$REF' doesn't exist."
            exit 1
          }
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::'$REF' isn't on main."
            exit 1
          }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
